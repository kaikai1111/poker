name: Publish shared API to Supabase
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: supabase-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Configure administrator bootstrap
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          TABLE_SETUP_CODE: ${{ secrets.TABLE_SETUP_CODE }}
        run: |
          test -n "$PROJECT_REF"
          test -n "$TABLE_SETUP_CODE"
          supabase secrets set --project-ref "$PROJECT_REF" "TABLE_SETUP_CODE=$TABLE_SETUP_CODE"
      - name: Deploy API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy table-api --project-ref "$PROJECT_REF" --no-verify-jwt
