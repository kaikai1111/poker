name: Test TABLE
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: table_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/table-api/index.ts
      - run: deno test --allow-read tests/shared-api.test.ts
      - run: node tests/cloud-policy.test.js
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Database permission and transaction tests
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: test-only
          PGDATABASE: table_test
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/cloud-db-fixture.sql
          psql -v ON_ERROR_STOP=1 -f supabase/setup.sql
          psql -v ON_ERROR_STOP=1 -f tests/cloud-db.test.sql
